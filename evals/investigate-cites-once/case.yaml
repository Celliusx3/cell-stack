schema_version: "1.1"
name: investigate-cites-once
description: Asking cell-mode whether a function is right should route to the Investigate playbook, change nothing, run a command that settles the claim, and answer with each claim's evidence given once, inside the sentence that makes it, with no separate file list.
tags: [cell-mode, investigate]
runs: 2
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
