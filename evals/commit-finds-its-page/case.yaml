schema_version: "1.1"
name: commit-finds-its-page
description: Asking cell-mode to commit a working tree that holds two stories should open the commit page from the mode's procedures list, make one commit per story with the fix first, prove each passes on its own, and push nothing.
tags: [cell-mode, procedures, commit]
runs: 2
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
