schema_version: "1.1"
name: feature-parses-at-the-boundary
description: A new column, asked for with no questions or stops, should route to the Feature playbook, be researched, be saved as a spec and tickets, be built through the Build playbook, be parsed into a typed row model at load, be written by a subagent from a failing test, and be shown running.
tags: [cell-mode, feature, rule-typed-boundaries]
runs: 2
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
