schema_version: "1.1"
name: name-a-new-function
description: Pulling the report out of cli.py into one new function should route to the Refactor playbook, read the naming rule, and name the function for what the caller gets back, never a bare verb or noun that fits anything.
tags: [cell-mode, refactor, rule-name-for-the-reader]
runs: 2
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
