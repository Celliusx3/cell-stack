schema_version: "1.1"
name: review-skill-finds-subtle-risks
description: Reviewing a migration skill with subtle risks should open the review-skill page, run its linter, and find the free-form production step, the missing backup and verify loop, the MCP tool without its server prefix, the unclear script step and the unexplained 47, without faulting the good description.
tags: [cell-mode, procedures, review]
runs: 2
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
