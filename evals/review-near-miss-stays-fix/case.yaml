schema_version: "1.1"
name: review-near-miss-stays-fix
description: A bug report about code must stay with the Fix playbook and never open a review page, even though the review procedures also talk about wrong behaviour.
tags: [cell-mode, procedures, review]
runs: 2
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
