schema_version: "1.1"
name: fix-is-the-smallest-change
description: A one-line bug should route through cell-mode and be fixed with a diff that touches only lines tracing to the bug, adds no helper, no option and no file, and proves it with a failing-then-passing test.
tags: [cell-mode, principle-smallest-change]
runs: 2
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, Edit, Write, Bash, Agent]
context:
  scaffold_script: fixture.sh
